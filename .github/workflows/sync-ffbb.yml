name: Synchronisation FFBB - ES Pennes Mirabeau

on:
  schedule:
    # Exécution automatique tous les jours à 06h00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permet de lancer la mise à jour manuellement en 1 clic sur GitHub

permissions:
  contents: write

jobs:
  sync-ffbb:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de ffbb-data-client
        run: |
          python -m pip install --upgrade pip
          pip install ffbb-data-client

      - name: Extraction des rencontres ES Pennes Mirabeau (SUD0013043)
        run: |
          mkdir -p data
          python scripts/sync_ffbb.py

      - name: Commit et publication du fichier JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ffbb-matches.json
          git diff --staged --quiet || git commit -m "chore(ffbb): mise à jour automatique des rencontres SUD0013043"
          git push